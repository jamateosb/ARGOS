# Tool configuration only. Dependencies are declared in requirements.txt;
# ARGOS runs from the repository checkout and is not installed as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests", "scripts"]
